<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MEN'S LINE — Fondo con video (maqueta)</title>
<style>
:root{--oro:#daa64e;--oro2:#e8b856;--fondo:#2b1c10;}
*{margin:0;box-sizing:border-box}
body{font-family:'Trebuchet MS',sans-serif;background:var(--fondo);color:#fff;min-height:100vh}
video{position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:0}
.overlay{position:fixed;inset:0;background:linear-gradient(to bottom,rgba(43,28,16,.55),rgba(43,28,16,.85));z-index:1}
.card{position:relative;z-index:2;max-width:520px;margin:0 auto;padding:48px 24px;text-align:center;display:grid;gap:18px}
h1{font-size:2rem;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.slog{color:var(--oro2);letter-spacing:2px;font-size:.85rem}
a.b{display:block;background:var(--oro);color:#1d1209;font-weight:bold;padding:14px;border-radius:10px;text-decoration:none;font-size:1rem}
a.b.ghost{background:transparent;border:1.5px solid var(--oro);color:var(--oro2)}
img.logo{width:110px;margin:0 auto;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5))}
</style>
</head>
<body>
<video autoplay muted loop playsinline poster="logo_diamante.png">
  <source src="barber.mp4" type="video/mp4">
</video>
<div class="overlay"></div>
<main class="card">
  <img class="logo" src="logo_diamante.png" alt="MEN'S LINE">
  <div><h1>MEN'S LINE</h1><p class="slog">PROFESSIONAL STUDIO</p></div>
  <a class="b" href="https://is.gd/menslinerev">⭐ Déjanos tu reseña en Google</a>
  <a class="b" href="https://wa.me/573148761424">💬 Reserva tu cita por WhatsApp</a>
  <a class="b ghost" href="https://maps.google.com/?cid=2185886682577761685">📍 Encuéntranos en Maps</a>
</main>
</body>
</html>
