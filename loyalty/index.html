<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#2b1c10">
<title>MensLine Diamond Club</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="logo_diamante.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Simonetta:wght@400;900&family=Great+Vibes&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles/main.css">
</head>
<body>
<!-- CARRUSEL DE FOTOS COMO FONDO (fuera de .wrap: su animación no debe afectar al position:fixed) -->
<div id="lbg" class="lbg"></div><div class="lveil"></div>
<!-- degradado dorado compartido por los diamantes de la escalera -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="mlGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6dca0"/><stop offset=".5" stop-color="#e8b856"/><stop offset="1" stop-color="#b8862f"/></linearGradient>
</defs></svg>
<div class="wrap">
  <div class="head">
    <img class="logo" src="logo_diamante.png" alt="">
    <h1>Mens<b>Line</b> Diamond Club</h1>
    <p class="sub">Tu membresía de diamantes<br>Tu próxima cita, a un toque.</p>
  </div>

  <div class="colL">
  <!-- REGISTRO -->
  <div id="regView" class="card hidden">
    <p class="mut center" style="margin-bottom:14px">Regístrate una sola vez para ganar diamantes:</p>
    <input id="regName" type="text" placeholder="Tu nombre" maxlength="30">
    <input id="regPhone" type="tel" inputmode="numeric" placeholder="Tu celular (WhatsApp)" maxlength="12">
    <button id="regBtn">COMENZAR MIS DIAMANTES</button>
    <p id="regMsg" class="mut center" style="margin-top:10px"></p>
  </div>

  <!-- CARNET -->
  <div id="stView" class="card hidden">
    <p class="mut center" id="hello"></p>
    <div class="vcard hidden" id="vcard">
      <div class="sheen"></div>
      <div class="vhead"><img src="logo_diamante.png" alt=""><span class="vt">DIAMOND CLUB</span></div>
      <div class="vname" id="vname"></div>
      <div class="vmeta" id="vmeta"></div>
      <div class="vdiamonds"><span class="vdots" id="vdots"></span><span class="vcount" id="vcount"></span></div>
      <div class="vfoot"><span class="vf">MEMBRESÍA VIRTUAL</span><span class="vf" id="vcyc"></span></div><button id="vcWallet" style="display:none;margin:-2px 12px 14px;padding:10px 12px;border-radius:12px;border:1px solid rgba(232,184,86,.55);background:linear-gradient(180deg,#3a2512,#241505);color:#e8b856;font-weight:700;letter-spacing:.08em;font-size:.72rem;width:calc(100% - 24px)">⬇ GUARDAR EN GOOGLE WALLET</button>
    </div>
    <div class="diamonds" id="dmRow"></div>
    <p class="prog" id="prog"></p>
    <div class="bar"><i id="barFill" style="width:0%"></i></div>
    <div id="rewardBox" class="reward hidden">
      <h2>¡RECOMPENSA LISTA!</h2>
      <code id="rewardCode"></code>
      <p class="mut">Preséntale este código en recepción. El staff la valida y empiezas tu nuevo ciclo.</p>
    </div>
    <p id="statusMsg"></p>
  </div>
  </div>

  <div class="colR">
  <p class="sec">ESCALERA DE RECOMPENSAS</p>
  <div class="ladder" id="ladder"></div>
  </div>
</div>

<!-- Anatomía del frontend (developarce): components/ organiza · CSS viste ·
     js controla · services/ conecta · pages/ arranca -->
<script type="module" src="pages/app.js"></script>
<script type="module" src="components/background.js"></script>
</body>
</html>
