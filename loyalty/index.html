<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#2b1c10">
<title>MensLine Diamond Club</title>
<link rel="manifest" href="/loyalty/manifest.webmanifest">
<link rel="icon" href="/loyalty/logo_diamante.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== MensLine Diamond Club — estilo según BRAND.md (solo CSS/HTML) ===== */
:root{
  --bg:#23150b;--bg2:#2b1c10;--gold:#daa64e;--goldl:#e8b856;--goldd:#443319;
  --stroke:#fbe7b8;--txt:#f4ead9;--mut:#b39b78;
  --serif:'Playfair Display',Georgia,serif;--sans:'Inter',system-ui,-apple-system,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:var(--sans)}
html,body{overflow-x:hidden;max-width:100%}
body{
  background:var(--bg);color:var(--txt);min-height:100vh;
  display:flex;flex-direction:column;align-items:center;padding:28px 16px calc(28px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
.wrap{width:100%;max-width:430px;display:flex;flex-direction:column;gap:16px;animation:rise .6s ease both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.logo{width:88px;align-self:center;margin-top:6px;filter:drop-shadow(0 4px 14px #0007) drop-shadow(0 0 10px #daa64e3b)}
h1{font-family:var(--serif);font-weight:600;font-size:1.72rem;line-height:1.1;letter-spacing:.015em;
   color:var(--goldl);text-align:center;
   background:linear-gradient(180deg,#f6dca0,var(--gold));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
h1 b{font-weight:700;-webkit-text-fill-color:#fff;color:#fff}
.sub{color:#e9e2d2;font-size:.9rem;line-height:1.5;text-align:center;letter-spacing:.01em;text-shadow:0 1px 8px rgba(0,0,0,.9)}
.logo,h1{filter:drop-shadow(0 2px 14px rgba(0,0,0,.75))}

/* --- Tarjeta GLASS (mismo look que los botones del linktree): casi transparente,
       borde dorado fino que se ilumina al hover, blur ligero → se ve el carrusel --- */
.card{position:relative;background:rgba(10,7,3,.28);border:1px solid rgba(232,184,86,.38);border-radius:20px;
      padding:24px 22px;box-shadow:0 6px 22px rgba(0,0,0,.35);
      -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:border-color .25s,background .25s,box-shadow .25s}
.card:hover,.card:focus-within{border-color:var(--goldl);background:rgba(20,14,6,.34);box-shadow:0 8px 26px rgba(0,0,0,.4),0 0 18px rgba(232,184,86,.14)}
.card .mut{color:#d8ccb6;text-shadow:0 1px 6px rgba(0,0,0,.8)}

/* --- Diamantes --- */
.diamonds{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin:20px 0 12px}
.dm{width:50px;height:50px;transition:transform .3s ease}
.dm.earned{filter:drop-shadow(0 3px 8px #daa64e88)}
/* el diamante más reciente (último ganado) con glow pulsante */
#dmRow .dm.earned:not(:has(+ .dm.earned)){animation:glow 2.1s ease-in-out infinite}
/* destello dorado al sumar (la lógica añade .pop al nuevo diamante) */
.dm.pop{animation:pop .6s ease}
#dmRow .dm.earned.pop:not(:has(+ .dm.earned)){animation:pop .6s ease, glow 2.1s ease-in-out .6s infinite}
@keyframes pop{0%{transform:scale(1)}28%{transform:scale(1.5);filter:drop-shadow(0 0 18px var(--goldl))}60%{transform:scale(.94)}100%{transform:scale(1)}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 4px #daa64e77)}50%{filter:drop-shadow(0 0 14px var(--goldl)) drop-shadow(0 0 3px var(--stroke))}}

.prog{font-family:var(--serif);font-weight:600;font-size:1.22rem;color:var(--goldl);text-align:center;letter-spacing:.02em}
.bar{height:6px;background:rgba(255,255,255,.08);border:1px solid rgba(232,184,86,.22);border-radius:99px;overflow:hidden;margin-top:14px}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--goldl),var(--stroke));transition:width .6s cubic-bezier(.22,1,.36,1)}

/* --- Formularios --- */
/* inputs estilo underline: sin fondo, solo línea dorada inferior + texto claro */
input{width:100%;padding:12px 2px;border:0;border-bottom:1px solid rgba(232,184,86,.45);border-radius:0;background:transparent;
  color:#fff;font-size:1rem;margin-bottom:18px;transition:border-color .25s,box-shadow .25s;-webkit-appearance:none;appearance:none}
input::placeholder{color:rgba(233,226,210,.6)}
input:focus{outline:none;border-bottom-color:var(--goldl);box-shadow:0 1px 0 0 var(--goldl)}
input:-webkit-autofill{-webkit-text-fill-color:#fff;transition:background-color 9999s ease 0s}
button{width:100%;padding:15px;border:0;border-radius:14px;background:linear-gradient(135deg,#b8862f,var(--gold) 45%,var(--goldl));color:#2a1a0b;font-family:var(--sans);font-weight:700;font-size:1rem;letter-spacing:.04em;cursor:pointer;box-shadow:0 8px 20px #daa64e33;transition:transform .15s,box-shadow .25s,filter .25s}
button:hover{filter:brightness(1.05);box-shadow:0 10px 26px #daa64e4d}
button:active{transform:scale(.97)}
button:disabled{opacity:.5;cursor:wait;filter:none}

/* --- Recompensa --- */
.reward{text-align:center;padding:20px;border:1px solid var(--goldl);border-radius:16px;background:rgba(232,184,86,.08);margin-top:16px;box-shadow:0 0 22px rgba(232,184,86,.18);animation:rise .5s ease both}
.reward h2{font-family:var(--serif);font-weight:600;color:var(--goldl);font-size:1.18rem;letter-spacing:.03em}
.reward code{display:block;font-size:2.05rem;letter-spacing:.34em;color:#fff;margin:12px 0;font-family:'Courier New',monospace;text-shadow:0 2px 10px #daa64e66}

/* ══ CARRUSEL DE FOTOS: ahora es el FONDO de toda la página ══ */
.lbg{position:fixed;inset:0;z-index:-2;overflow:hidden;background:var(--bg)}
.lbg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 20%;
  opacity:0;transition:opacity 1.2s ease}
.lbg img.on{opacity:1;animation:kb 5.2s linear forwards}
@keyframes kb{from{transform:scale(1.04)}to{transform:scale(1.12)}}
.lveil{position:fixed;inset:0;z-index:-1;
  background:linear-gradient(180deg,rgba(20,10,2,.72) 0%,rgba(20,10,2,.42) 30%,rgba(20,10,2,.5) 65%,rgba(10,5,1,.9) 100%)}

/* ══ ESCALERA DE RECOMPENSAS — lista limpia, sin cajitas negras ══ */
.ladder{display:flex;flex-direction:column;margin-top:10px}
.step{display:flex;align-items:center;gap:16px;padding:15px 10px;border-radius:12px;
  border:0;border-bottom:1px solid rgba(232,184,86,.16);transition:background .25s}
.step:last-child{border-bottom:0}
.step>div{min-width:0}
/* diamante de marca line-art (mismo trazo en todos los niveles) */
.gem{width:34px;height:34px;flex:none;overflow:visible}
.gem path{fill:none;stroke:var(--goldl);stroke-width:1.4;stroke-linejoin:round;stroke-linecap:round}
.gem .f{stroke-width:.9}
.step .gem{opacity:.38}                                   /* futuros: outline tenue */
.step.done .gem{opacity:.85}                              /* ya ganados: outline firme */
.step.done .gem .o{fill:rgba(232,184,86,.18)}
.step.here .gem{opacity:1;animation:gemglow 2.4s ease-in-out infinite}  /* alcanzado: relleno brillante */
.step.here .gem .o{fill:url(#mlGold);stroke:var(--stroke)}
.step.here .gem .f{stroke:rgba(255,248,230,.75)}
@keyframes gemglow{0%,100%{filter:drop-shadow(0 0 3px rgba(232,184,86,.5))}50%{filter:drop-shadow(0 0 11px rgba(232,184,86,.9))}}
.step .n{font-family:var(--serif);font-weight:600;color:var(--goldl);font-size:1.05rem;letter-spacing:.01em;
  line-height:1.25;text-shadow:0 1px 8px rgba(0,0,0,.85)}
.step .n .k{color:#e9e2d2;font-weight:500;margin-right:6px;opacity:.8}
.step .s2{font-size:.8rem;color:#cdbfa6;margin-top:3px;letter-spacing:.02em;text-shadow:0 1px 6px rgba(0,0,0,.85)}
.step.here{background:linear-gradient(90deg,rgba(232,184,86,.14),rgba(232,184,86,0))}
.step.here .n{color:#fff;text-shadow:0 0 12px rgba(232,184,86,.5),0 1px 8px rgba(0,0,0,.8)}
.step.here .s2{color:var(--goldl)}
.sec{font-family:var(--serif);font-weight:600;color:var(--goldl);font-size:1rem;letter-spacing:.18em;margin-top:2px;text-align:center;
  text-shadow:0 1px 8px rgba(0,0,0,.85);display:flex;align-items:center;gap:12px}
.sec::before,.sec::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(232,184,86,0),rgba(232,184,86,.55))}
.sec::after{background:linear-gradient(90deg,rgba(232,184,86,.55),rgba(232,184,86,0))}

.mut{color:var(--mut);font-size:.86rem;line-height:1.5}
.center{text-align:center}
.hidden{display:none!important}
#statusMsg{text-align:center;font-size:.92rem;margin-top:10px;min-height:1.2em;transition:color .3s}

/* ══ MÓVIL: una columna con aire ══ */
@media (max-width:819px){
  .wrap{gap:22px}
  .colL,.colR{width:100%;min-width:0}
  .colR{padding-top:4px}
}
@media (max-width:380px){
  h1{font-size:1.5rem}
  .dm{width:44px;height:44px}
  .diamonds{gap:9px}
  .reward code{font-size:1.7rem;letter-spacing:.26em}
}
/* ══ PC: la página deja de verse "de celular" — columnas elegantes ══ */
@media (min-width:820px){
  body{padding:56px 24px}
  .wrap{max-width:880px;display:grid;grid-template-columns:1fr 1fr;gap:20px 46px;align-items:start}
  .logo{width:110px}
  h1{font-size:2.2rem}
  .sub{font-size:1rem}
  .head{grid-column:1/3;grid-row:1}
  .colL{grid-column:1;grid-row:2;min-width:0}
  .colR{grid-column:2;grid-row:2;padding-top:8px;min-width:0}
  .card{padding:28px 26px}
  .diamonds{margin-top:26px}
  .dm{width:56px;height:56px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
</style>
</head>
<body>
<!-- CARRUSEL DE FOTOS COMO FONDO (fuera de .wrap: su animación no debe afectar al position:fixed) -->
<div id="lbg" class="lbg"></div><div class="lveil"></div>
<!-- degradado dorado compartido por los diamantes de la escalera -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="mlGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6dca0"/><stop offset=".5" stop-color="#e8b856"/><stop offset="1" stop-color="#b8862f"/></linearGradient>
</defs></svg>
<div class="wrap">
  <div class="head">
    <img class="logo" src="/loyalty/logo_diamante.png" alt="">
    <h1>Mens<b>Line</b> Diamond Club</h1>
    <p class="sub">Tu membresía de diamantes<br>Tu próxima cita, a un toque.</p>
  </div>

  <div class="colL">
  <!-- REGISTRO -->
  <div id="regView" class="card hidden">
    <p class="mut center" style="margin-bottom:14px">Regístrate una sola vez para ganar diamantes:</p>
    <input id="regName" type="text" placeholder="Tu nombre" maxlength="30">
    <input id="regPhone" type="tel" inputmode="numeric" placeholder="Tu celular (WhatsApp)" maxlength="12">
    <button id="regBtn">COMENZAR MIS DIAMANTES</button>
    <p id="regMsg" class="mut center" style="margin-top:10px"></p>
  </div>

  <!-- CARNET -->
  <div id="stView" class="card hidden">
    <p class="mut center" id="hello"></p>
    <div class="diamonds" id="dmRow"></div>
    <p class="prog" id="prog"></p>
    <div class="bar"><i id="barFill" style="width:0%"></i></div>
    <div id="rewardBox" class="reward hidden">
      <h2>¡RECOMPENSA LISTA!</h2>
      <code id="rewardCode"></code>
      <p class="mut">Preséntale este código en recepción. El staff la valida y empiezas tu nuevo ciclo.</p>
    </div>
    <p id="statusMsg"></p>
  </div>
  </div>

  <div class="colR">
  <p class="sec">ESCALERA DE RECOMPENSAS</p>
  <div class="ladder" id="ladder"></div>
  </div>
</div>

<script>
/* ══════ SERVIDOR REAL (Cloudflare) — PC y celulares comparten la misma base ══════ */
const API = "https://mensline-diamond-club.santa250613.workers.dev";
const GOAL = 5;
const $ = id => document.getElementById(id);
const DM = earned => `<svg class="dm ${earned?'earned':''}" viewBox="0 0 64 64">
 ${earned
   ? '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8b856"/><stop offset="1" stop-color="#b8862f"/></linearGradient></defs><g fill="url(#g)" stroke="#fbe7b8" stroke-width="1.5"><path d="M32 2 14 18 32 60 50 18z"/><path d="M14 18h36L32 60z" fill="#f3d38c" opacity=".55"/></g>'
   : '<g fill="none" stroke="#7a5c30" stroke-width="2.5" opacity=".85"><path d="M32 2 14 18 32 60 50 18z"/><path d="M14 18h36M32 2 18 18 32 60M32 2 46 18 32 60" stroke-width="1.4" opacity=".5"/></g>'}
</svg>`;
/* Cada diamante = una recompensa (el dueño las ajusta en el Excel del Drive) */
const REWARDS = [
  {n:1, t:"Corte gratis"},
  {n:2, t:"Masaje"},
  {n:3, t:"Uñas y pies"},
  {n:4, t:"Descarga muscular"},
  {n:5, t:"Combo completo"}
];
/* ══ CARRUSEL: fotos pro del studio pasan de una en una como FONDO (4.2 s) ══ */
/* ══ ESCALERA: qué recompensa toca en cada diamante ══ */
const PHOTOS = [
  {src:"../assets/web/foto1.jpg", tag:"Barbería privada"},
  {src:"../assets/web/foto2.jpg", tag:"Fisioterapia"},
  {src:"../assets/web/foto3.jpg", tag:"Nails"},
  {src:"../assets/web/foto4.jpg", tag:"MEN'S LINE Studio"},
  {src:"../assets/web/foto5.jpg", tag:"MEN'S LINE Studio"},
  {src:"../assets/web/foto6.jpg", tag:"MEN'S LINE Studio"}
];
let picIdx = 0;
const lbg = document.getElementById("lbg"), bgImgs = [];
PHOTOS.forEach(p => { const im = new Image(); im.src = p.src; im.alt = ""; lbg.appendChild(im); bgImgs.push(im); });
function tick(){
  bgImgs.forEach(im => im.classList.remove("on"));
  picIdx = (picIdx + 1) % bgImgs.length;
  bgImgs[picIdx].classList.add("on");
}
bgImgs[0].addEventListener("load", () => { picIdx = 0; tick(); }, {once:true});
if (bgImgs[0].complete) tick();
setTimeout(() => { if (!bgImgs.some(im => im.classList.contains("on"))) tick(); }, 2500);
setInterval(tick, 4200);
/* ══ ESCALERA: qué recompensa toca en cada diamante ══ */
/* diamante de marca line-art: .o = silueta, .f = facetas */
const GEM = `<svg class="gem" viewBox="0 0 64 64" aria-hidden="true">
  <path class="o" d="M21 12H43L54 25L32 55L10 25Z"/>
  <path class="f" d="M10 25H54M21 12L26 25L32 55L38 25L43 12M26 25L32 12L38 25"/>
</svg>`;
function drawLadder(stamps){
  const el = $("ladder"); if (!el) return;
  el.innerHTML = REWARDS.map(r=>{
    const done = r.n <= stamps, here = r.n === stamps + 1;
    return `<div class="step ${here?'here':''} ${done?'done':''}">
      ${GEM}
      <div><div class="n"><span class="k">${r.n}</span>${r.t}</div>
      <div class="s2">${done ? "Recompensa disponible" : here ? "Tu próximo diamante" : "Por referir a " + r.n + (r.n===1 ? " amigo" : " amigos")}</div></div>
    </div>`;
  }).join("");
}
async function api(path, body){
  const r = await fetch(API + path, body === undefined ? {} : {
    method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify(body)
  });
  return r.json();
}
function statusText(c){
  if (c.rewardPending) return "CICLO COMPLETO 💎";
  return `${c.stamps} de ${GOAL} diamantes`;
}
function render(c){
  $("regView").classList.add("hidden");
  $("stView").classList.remove("hidden");
  $("hello").textContent = `Hola, ${c.name} · Membresía #${String(c.phone).slice(-4)}`;
  $("statusMsg").style.color = "#b39b78";
  if (c.rewardPending){
    $("dmRow").innerHTML = Array.from({length:GOAL},()=>DM(true)).join("");
    $("prog").textContent = statusText(c);
    $("barFill").style.width = "100%";
    $("rewardBox").classList.remove("hidden");
    $("rewardCode").textContent = c.rewardCode;
    if (!sessionStorage.getItem("ml_rw")){
      sessionStorage.setItem("ml_rw","1");
      if ("Notification" in window && Notification.permission === "granted")
        new Notification("💎 ¡Recompensa lista!", { body: "Código: " + c.rewardCode });
    }
  } else {
    $("rewardBox").classList.add("hidden");
    $("dmRow").innerHTML = Array.from({length:GOAL},(_,i)=>DM(i < c.stamps)).join("");
    $("prog").textContent = statusText(c);
    $("barFill").style.width = (c.stamps/GOAL*100) + "%";
  }
  drawLadder(c.rewardPending ? GOAL : c.stamps);
}
function popIndex(i){ const el = document.querySelectorAll("#dmRow svg")[i]; if (el) el.classList.add("pop"); }

/* ══ EN VIVO: el carnet del cliente se actualiza solo (cada 4 s) cuando el staff
   suma diamantes, entrega la recompensa o reinicia el ciclo desde el panel ══ */
let ME = null, lastSig = "";
const sig = c => [c.stamps, c.rewardPending ? 1 : 0, c.rewardCode || ""].join("|");
async function live(){
  if (!ME) return;
  const s = await api("/status?phone=" + ME.phone);
  if (!s.ok || !s.client) return;
  const c = s.client;
  if (sig(c) !== lastSig){
    const prev = ME.stamps;
    ME = c; lastSig = sig(c);
    render(c);
    if (c.rewardPending && c.stamps === prev && prev === GOAL){
      // el staff entregó la recompensa → ciclo nuevo, celebrar el reinicio
      $("statusMsg").style.color = "#8fd48f";
      $("statusMsg").textContent = "🎁 Recompensa entregada. ¡A ganar diamantes otra vez!";
      popIndex(0);
    } else if (c.stamps > prev){
      popIndex(c.stamps-1);
      $("statusMsg").style.color = "#8fd48f";
      $("statusMsg").textContent = "✨ Diamante " + c.stamps + "/" + GOAL + " registrado por tu visita de hoy";
    } else if (c.stamps < prev && !c.rewardPending){
      $("statusMsg").style.color = "#b39b78";
      $("statusMsg").textContent = "El staff reinició tu ciclo. Empieza de nuevo 💎";
    }
  }
}
setInterval(live, 4000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) live(); });

async function boot(){
  drawLadder(0); // la escalera se ve desde un inicio, con o sin carnet
  const ph = localStorage.getItem("ml_self");
  if (!ph){ $("regView").classList.remove("hidden"); return; }
  const s = await api("/status?phone=" + ph);
  if (s.ok && s.client){ ME = s.client; lastSig = sig(s.client); render(s.client); autoVisit(s.client); }
  else localStorage.removeItem("ml_self");
}
/* ⬇️ AUTO: abrir la app (tocar la tarjeta NFC) = +1 diamante, MÁXIMO 1 POR DÍA — lo decide el servidor */
async function autoVisit(c){
  if (c.rewardPending) return;
  const v = await api("/visit", { phone: c.phone });
  if (!v.ok) return;
  try { Notification.requestPermission(); } catch(_) {}
  render(v.client);
  if (v.added){
    if (v.reward){
      popIndex(GOAL-1);
    } else {
      popIndex(v.client.stamps-1);
      $("statusMsg").style.color = "#8fd48f";
      $("statusMsg").textContent = "✨ Diamante " + v.client.stamps + "/" + GOAL + " registrado por tu visita de hoy";
    }
  } else if (!v.waiting){
    $("statusMsg").textContent = "✨ Ya registramos tu visita de hoy. ¡Nos vemos mañana!";
  }
}
$("regBtn").onclick = async () => {
  const name = $("regName").value.trim();
  const phone = $("regPhone").value.replace(/\D/g,"");
  if (!name || phone.length < 7){ $("regMsg").textContent = "Completa nombre y celular"; return; }
  $("regBtn").disabled = true;
  const r = await api("/register", { name, phone });
  $("regBtn").disabled = false;
  if (!r.ok){ $("regMsg").textContent = r.err || "Error, intenta de nuevo"; return; }
  localStorage.setItem("ml_self", r.client.phone);
  ME = r.client; lastSig = sig(r.client);
  $("regMsg").textContent = "¡Listo, " + name + "! Ya eres del Diamond Club 💎";
  render(r.client);
  autoVisit(r.client);   // el registro cuenta como la primera visita
};
boot();
</script>
</body>
</html>
